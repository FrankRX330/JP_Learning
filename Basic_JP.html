<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日文50音＋濁音練習（錯題·隨機·單字）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    color: #eee;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 28px 22px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 1.2rem;
    margin-bottom: 6px;
    color: #ffd369;
  }
  .subtitle {
    text-align: center;
    font-size: 0.78rem;
    color: #aaa;
    margin-bottom: 14px;
  }
  .mode-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mode-switch button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #ccc;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .mode-switch button.active {
    background: #ffd369;
    color: #1a1a2e;
    font-weight: bold;
  }
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar button {
    flex-shrink: 0;
    padding: 7px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    background: rgba(255,255,255,0.05);
    color: #ccc;
    font-size: 0.76rem;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
  }
  .filter-bar button.active {
    background: #ffd369;
    color: #1a1a2e;
    border-color: #ffd369;
    font-weight: bold;
  }

  /* 工具列：隨機開關 */
  .tool-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .toggle-btn {
    padding: 7px 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    font-size: 0.76rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .toggle-btn.on {
    background: #2ecc71;
    border-color: #2ecc71;
    color: #fff;
    font-weight: bold;
  }

  .card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 26px 20px;
    text-align: center;
    margin-bottom: 16px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .kana {
    font-size: 4.6rem;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 6px;
    user-select: none;
  }
  .romaji {
    font-size: 1.3rem;
    color: #ffd369;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .type-label {
    font-size: 0.72rem;
    color: #888;
    margin-bottom: 10px;
  }
  /* 單字範例 */
  .example {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .example:hover { background: rgba(255,211,105,0.1); border-color: rgba(255,211,105,0.3); }
  .ex-word {
    font-size: 1.2rem;
    color: #fff;
    font-weight: bold;
  }
  .ex-reading {
    font-size: 0.78rem;
    color: #ffd369;
  }
  .ex-meaning {
    font-size: 0.78rem;
    color: #aaa;
  }

  .progress {
    text-align: center;
    font-size: 0.78rem;
    color: #aaa;
    margin-bottom: 10px;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .controls button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: 0.2s;
    font-weight: bold;
  }
  .btn-prev, .btn-next {
    background: rgba(255,255,255,0.15);
    color: #eee;
  }
  .btn-prev:hover, .btn-next:hover { background: rgba(255,255,255,0.25); }
  .btn-play {
    background: #ffd369;
    color: #1a1a2e;
  }
  .btn-play:hover { background: #ffc107; }

  .write-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 320px;
    margin: 0 auto 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    border: 2px dashed rgba(255,255,255,0.15);
    overflow: hidden;
  }
  .write-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #guideCanvas { pointer-events: none; }
  #drawCanvas { cursor: crosshair; }

  .romaji-badge {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,211,105,0.9);
    color: #1a1a2e;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 4px 16px;
    border-radius: 999px;
    pointer-events: none;
    user-select: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 5;
  }

  .write-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .write-controls button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 0.88rem;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-clear { background: rgba(231,76,60,0.8); color: #fff; }
  .btn-clear:hover { background: #e74c3c; }
  .btn-guide { background: rgba(255,255,255,0.15); color: #eee; }
  .btn-guide:hover { background: rgba(255,255,255,0.25); }
  .btn-guide.on { background: #2ecc71; color: #fff; }

  .hint {
    text-align: center;
    font-size: 0.73rem;
    color: #888;
    margin-bottom: 12px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .options button {
    padding: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .options button:hover {
    border-color: #ffd369;
    background: rgba(255,211,105,0.1);
  }
  .options button.correct { background: #2ecc71; border-color: #2ecc71; }
  .options button.wrong { background: #e74c3c; border-color: #e74c3c; }
  .options button:disabled { cursor: default; opacity: 0.7; }

  .feedback {
    text-align: center;
    font-size: 1rem;
    min-height: 24px;
    margin-top: 12px;
    font-weight: bold;
  }
  .feedback.ok { color: #2ecc71; }
  .feedback.no { color: #e74c3c; }
  .stats {
    display: flex;
    justify-content: space-around;
    font-size: 0.78rem;
    color: #aaa;
    margin-top: 14px;
  }

  /* 錯題區 */
  .wrong-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .wrong-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .wrong-header span {
    font-size: 0.82rem;
    color: #e74c3c;
    font-weight: bold;
  }
  .wrong-header button {
    padding: 7px 14px;
    border: none;
    border-radius: 10px;
    background: #e74c3c;
    color: #fff;
    font-size: 0.78rem;
    font-weight: bold;
    cursor: pointer;
  }
  .wrong-header button:disabled {
    background: rgba(255,255,255,0.1);
    color: #666;
    cursor: default;
  }
  .wrong-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 120px;
    overflow-y: auto;
  }
  .wrong-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: rgba(231,76,60,0.15);
    border: 1px solid rgba(231,76,60,0.4);
    border-radius: 999px;
    font-size: 0.82rem;
    color: #fff;
    cursor: pointer;
  }
  .wrong-chip .chip-romaji {
    font-size: 0.7rem;
    color: #e74c3c;
  }
  .empty-hint {
    font-size: 0.78rem;
    color: #666;
    text-align: center;
    padding: 8px;
  }

  .hidden { display: none; }
  @media (max-width: 400px) {
    .kana { font-size: 4rem; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>日文50音＋濁音練習</h1>
  <p class="subtitle">聽發音 · 看字形 · 動手寫 · 練單字</p>

  <div class="mode-switch">
    <button id="modeLearn" class="active">學習</button>
    <button id="modeWrite">手寫</button>
    <button id="modeQuiz">測驗</button>
  </div>

  <div class="filter-bar" id="filterBar">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="清音">清音</button>
    <button data-filter="濁音">濁音</button>
    <button data-filter="半濁音">半濁音</button>
    <button data-filter="平假名">平假名</button>
    <button data-filter="片假名">片假名</button>
  </div>

  <!-- 隨機開關（學習／手寫模式共用） -->
  <div class="tool-bar" id="toolBar">
    <button class="toggle-btn" id="btnShuffle">🔀 順序：固定</button>
  </div>

  <!-- 學習模式 -->
  <div id="learnPanel">
    <div class="progress" id="learnProgress">1 / 142</div>
    <div class="card" id="learnCard">
      <div class="kana" id="learnKana">あ</div>
      <div class="romaji" id="learnRomaji">a</div>
      <div class="type-label" id="learnType">平假名 · 清音</div>
      <div class="example" id="learnExample">
        <span class="ex-word" id="learnExWord">あめ</span>
        <span class="ex-reading" id="learnExReading">ame</span>
        <span class="ex-meaning" id="learnExMeaning">雨</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn-prev" id="btnPrevLearn">← 上一個</button>
      <button class="btn-play" id="btnPlayLearn">🔊 聽發音</button>
      <button class="btn-next" id="btnNextLearn">下一個 →</button>
    </div>
  </div>

  <!-- 手寫模式 -->
  <div id="writePanel" class="hidden">
    <div class="progress" id="writeProgress">1 / 142</div>
    <div class="write-wrap">
      <canvas id="guideCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <div class="romaji-badge" id="writeRomaji">a</div>
    </div>
    <p class="hint" id="writeExHint">例：あめ（ame）雨</p>
    <div class="write-controls">
      <button class="btn-clear" id="btnClear">🗑 清除</button>
      <button class="btn-guide" id="btnGuide">👁 顯示正解</button>
      <button class="btn-play" id="btnPlayWrite" style="flex:1;border:none;border-radius:12px;background:#ffd369;color:#1a1a2e;font-weight:bold;cursor:pointer;">🔊 發音</button>
    </div>
    <div class="controls">
      <button class="btn-prev" id="btnPrevWrite">← 上一個</button>
      <button class="btn-next" id="btnNextWrite">下一個 →</button>
    </div>
  </div>

  <!-- 測驗模式 -->
  <div id="quizPanel" class="hidden">
    <div class="card" id="quizCard">
      <div class="kana" id="quizKana">あ</div>
      <div class="type-label" id="quizType">平假名 · 清音</div>
    </div>
    <div class="controls">
      <button class="btn-play" id="btnPlayQuiz">🔊 再聽一次</button>
    </div>
    <div class="options" id="quizOptions"></div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="stats">
      <span>正確：<b id="scoreCorrect">0</b></span>
      <span>錯誤：<b id="scoreWrong">0</b></span>
      <span>連續：<b id="scoreStreak">0</b></span>
    </div>

    <!-- 錯題區 -->
    <div class="wrong-section">
      <div class="wrong-header">
        <span>❌ 錯題：<b id="wrongCount">0</b> 個</span>
        <button id="btnRetryWrong" disabled>重練錯題</button>
      </div>
      <div class="wrong-list" id="wrongList">
        <div class="empty-hint">目前沒有錯題，繼續加油！</div>
      </div>
    </div>
  </div>
</div>

const synth = window.speechSynthesis;
function speak(text) {
  if (!synth) return;
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.8;
  synth.speak(utter);
}

// ====== 篩選與隨機 ======
let currentFilter = 'all';
let shuffleMode = false;
let filteredData = kanaData.slice();

function applyFilter(filter) {
  currentFilter = filter;
  if (filter === 'all') filteredData = kanaData.slice();
  else if (['清音','濁音','半濁音'].includes(filter)) filteredData = kanaData.filter(x => x.group === filter);
  else filteredData = kanaData.filter(x => x.type === filter);

  learnIndex = 0;
  writeIndex = 0;
  renderLearn();
  if (!writePanel.classList.contains('hidden')) {
    requestAnimationFrame(() => { resizeCanvas(); renderWrite(); });
  }
  if (!quizPanel.classList.contains('hidden')) newQuiz();
}

document.getElementById('filterBar').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  applyFilter(e.target.dataset.filter);
});

// ====== 學習模式 ======
let learnIndex = 0;
function renderLearn() {
  if (filteredData.length === 0) return;
  if (learnIndex >= filteredData.length) learnIndex = 0;
  const item = filteredData[learnIndex];
  learnKana.textContent = item.kana;
  learnRomaji.textContent = item.romaji;
  learnType.textContent = `${item.type} · ${item.group}`;
  learnProgress.textContent = `${learnIndex + 1} / ${filteredData.length}`;
  learnExWord.textContent = item.word;
  learnExReading.textContent = item.reading;
  learnExMeaning.textContent = item.meaning;
  btnPrevLearn.style.opacity = learnIndex === 0 ? 0.4 : 1;
  btnNextLearn.style.opacity = learnIndex === filteredData.length - 1 ? 0.4 : 1;
}
function prevLearn() { if (learnIndex > 0) { learnIndex--; renderLearn(); } }
function nextLearn() {
  if (shuffleMode) {
    learnIndex = Math.floor(Math.random() * filteredData.length);
  } else if (learnIndex < filteredData.length - 1) {
    learnIndex++;
  }
  renderLearn();
}
btnPrevLearn.addEventListener('click', prevLearn);
btnNextLearn.addEventListener('click', nextLearn);
btnPlayLearn.addEventListener('click', () => speak(filteredData[learnIndex].kana));
document.getElementById('learnCard').addEventListener('click', () => speak(filteredData[learnIndex].kana));

  speak(filteredData[learnIndex].word);
});

// ====== 手寫模式 ======
let writeIndex = 0;
let guideVisible = false;
let drawing = false;
let lastX = 0, lastY = 0;

const dCtx = drawCanvas.getContext('2d');
const gCtx = guideCanvas.getContext('2d');

function resizeCanvas() {
  const rect = drawCanvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  [guideCanvas, drawCanvas].forEach(c => {
    c.width = rect.width * dpr;
    c.height = rect.height * dpr;
    c.style.width = rect.width + 'px';
    c.style.height = rect.height + 'px';
  });
  dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dCtx.lineCap = 'round';
  dCtx.lineJoin = 'round';
  dCtx.strokeStyle = '#ffd369';
  dCtx.lineWidth = 6;
  redrawGuide();
}

function redrawGuide() {
  const w = guideCanvas.width / (window.devicePixelRatio || 1);
  const h = guideCanvas.height / (window.devicePixelRatio || 1);
  gCtx.clearRect(0, 0, w, h);
  if (!guideVisible || filteredData.length === 0) return;
  const item = filteredData[writeIndex];
  gCtx.save();
  gCtx.globalAlpha = 0.18;
  gCtx.fillStyle = '#ffffff';
  gCtx.textAlign = 'center';
  gCtx.textBaseline = 'middle';
  gCtx.font = `${Math.min(w, h) * 0.8}px "Hiragino Sans", "Noto Sans JP", sans-serif`;
  gCtx.fillText(item.kana, w / 2, h / 2);
  gCtx.globalAlpha = 0.12;
  gCtx.strokeStyle = '#ffffff';
  gCtx.lineWidth = 1;
  gCtx.beginPath();
  gCtx.moveTo(w / 2, 0); gCtx.lineTo(w / 2, h);
  gCtx.moveTo(0, h / 2); gCtx.lineTo(w, h / 2);
  gCtx.stroke();
  gCtx.restore();
}

function renderWrite() {
  if (filteredData.length === 0) return;
  if (writeIndex >= filteredData.length) writeIndex = 0;
  const item = filteredData[writeIndex];
  writeProgress.textContent = `${writeIndex + 1} / ${filteredData.length} · ${item.group}`;
  writeRomaji.textContent = item.romaji;
  writeExHint.textContent = `例：${item.word}（${item.reading}）${item.meaning}`;
  btnPrevWrite.style.opacity = writeIndex === 0 ? 0.4 : 1;
  btnNextWrite.style.opacity = writeIndex === filteredData.length - 1 ? 0.4 : 1;
  clearCanvas();
  redrawGuide();
}

function clearCanvas() {
  const w = drawCanvas.width / (window.devicePixelRatio || 1);
  const h = drawCanvas.height / (window.devicePixelRatio || 1);
  dCtx.clearRect(0, 0, w, h);
}
function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
}
function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  dCtx.beginPath();
  dCtx.moveTo(p.x, p.y);
  dCtx.lineTo(p.x + 0.1, p.y + 0.1);
  dCtx.stroke();
}
function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  dCtx.beginPath();
  dCtx.moveTo(lastX, lastY);
  dCtx.lineTo(p.x, p.y);
  dCtx.stroke();
  lastX = p.x; lastY = p.y;
}
function endDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  drawing = false;
}
drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
drawCanvas.addEventListener('touchend', endDraw, { passive: false });
drawCanvas.addEventListener('touchcancel', endDraw, { passive: false });
drawCanvas.addEventListener('mousedown', startDraw);
drawCanvas.addEventListener('mousemove', moveDraw);
drawCanvas.addEventListener('mouseup', endDraw);
drawCanvas.addEventListener('mouseleave', endDraw);

btnClear.addEventListener('click', clearCanvas);
btnGuide.addEventListener('click', () => {
  guideVisible = !guideVisible;
  btnGuide.classList.toggle('on', guideVisible);
  btnGuide.textContent = guideVisible ? '👁 隱藏正解' : '👁 顯示正解';
  redrawGuide();
});
btnPlayWrite.addEventListener('click', () => speak(filteredData[writeIndex].kana));
btnPrevWrite.addEventListener('click', () => { if (writeIndex > 0) { writeIndex--; renderWrite(); } });
btnNextWrite.addEventListener('click', () => {
  if (shuffleMode) {
    writeIndex = Math.floor(Math.random() * filteredData.length);
  } else if (writeIndex < filteredData.length - 1) {
    writeIndex++;
  }
  renderWrite();
});

// ====== 測驗模式（含錯題記錄） ======
let quizItem = null;
let quizAnswered = false;
let correctCount = 0, wrongCount = 0, streak = 0;
let wrongSet = new Map(); // key: kana, value: {item, count}
let retryMode = false;    // 是否正在重練錯題
let retryPool = [];       // 重練時的題庫

function pickRandom(arr, n, exclude) {
  return arr.filter(x => x.kana !== exclude.kana)
            .sort(() => Math.random() - 0.5)
            .slice(0, n);
}

function getQuizPool() {
  if (retryMode && retryPool.length > 0) return retryPool;
  return filteredData;
}

function newQuiz() {
  const pool = getQuizPool();
  if (pool.length < 4) return;
  quizAnswered = false;
  quizFeedback.textContent = '';
  quizFeedback.className = 'feedback';
  quizItem = pool[Math.floor(Math.random() * pool.length)];
  quizKana.textContent = quizItem.kana;
  quizType.textContent = `${quizItem.type} · ${quizItem.group}`;
  const options = [quizItem, ...pickRandom(pool, 3, quizItem)].sort(() => Math.random() - 0.5);
  quizOptions.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.romaji;
    btn.dataset.romaji = opt.romaji;
    btn.addEventListener('click', () => handleAnswer(btn, opt));
    quizOptions.appendChild(btn);
  });
}

function handleAnswer(btn, opt) {
  if (quizAnswered) return;
  quizAnswered = true;
  quizOptions.querySelectorAll('button').forEach(b => {
    b.disabled = true;
    if (b.dataset.romaji === quizItem.romaji) b.classList.add('correct');
  });
  if (opt.romaji === quizItem.romaji) {
    correctCount++; streak++;
    quizFeedback.textContent = '✅ 正確！';
    quizFeedback.className = 'feedback ok';
    // 答對時若在錯題集中，可考慮移除（這裡保留，讓使用者自己重練）
  } else {
    wrongCount++; streak = 0;
    btn.classList.add('wrong');
    quizFeedback.textContent = `❌ 正確答案是「${quizItem.romaji}」`;
    quizFeedback.className = 'feedback no';
    // 記錄錯題
    if (!wrongSet.has(quizItem.kana)) {
      wrongSet.set(quizItem.kana, { item: quizItem, count: 0 });
    }
    wrongSet.get(quizItem.kana).count++;
    renderWrongList();
  }
  scoreCorrectEl.textContent = correctCount;
  scoreWrongEl.textContent = wrongCount;
  scoreStreakEl.textContent = streak;
  setTimeout(newQuiz, 1200);
}

function renderWrongList() {
  wrongCountEl.textContent = wrongSet.size;
  wrongListEl.innerHTML = '';
  if (wrongSet.size === 0) {
    wrongListEl.innerHTML = '<div class="empty-hint">目前沒有錯題，繼續加油！</div>';
    btnRetryWrong.disabled = true;
    return;
  }
  btnRetryWrong.disabled = false;
  wrongSet.forEach(({ item, count }) => {
    const chip = document.createElement('div');
    chip.className = 'wrong-chip';
    chip.innerHTML = `<span>${item.kana}</span><span class="chip-romaji">${item.romaji}×${count}</span>`;
    chip.addEventListener('click', () => speak(item.kana));
    wrongListEl.appendChild(chip);
  });
}

// 重練錯題
btnRetryWrong.addEventListener('click', () => {
  if (wrongSet.size < 4) {
    alert('錯題少於 4 個，無法進行四選一測驗。請先繼續練習累積錯題。');
    return;
  }
  retryMode = true;
  retryPool = Array.from(wrongSet.values()).map(v => v.item);
  correctCount = 0; wrongCount = 0; streak = 0;
  scoreCorrectEl.textContent = '0';
  scoreWrongEl.textContent = '0';
  scoreStreakEl.textContent = '0';
  newQuiz();
  quizFeedback.textContent = '🔁 錯題重練中';
  quizFeedback.className = 'feedback';
});

// 離開測驗模式時重置重練狀態
function exitRetryMode() {
  retryMode = false;
  retryPool = [];
}

btnPlayQuiz.addEventListener('click', () => { if (quizItem) speak(quizItem.kana); });

// ====== 模式切換 ======
function switchMode(mode) {
  [modeLearn, modeWrite, modeQuiz].forEach(b => b.classList.remove('active'));
  [learnPanel, writePanel, quizPanel].forEach(p => p.classList.add('hidden'));
  // 切離測驗模式時取消重練
  if (mode !== 'quiz') exitRetryMode();

  if (mode === 'learn') {
    modeLearn.classList.add('active');
    learnPanel.classList.remove('hidden');
    renderLearn();
  } else if (mode === 'write') {
    modeWrite.classList.add('active');
    writePanel.classList.remove('hidden');
    requestAnimationFrame(() => { resizeCanvas(); renderWrite(); });
  } else {
    modeQuiz.classList.add('active');
    quizPanel.classList.remove('hidden');
    correctCount = wrongCount = streak = 0;
    scoreCorrectEl.textContent = '0';
    scoreWrongEl.textContent = '0';
    scoreStreakEl.textContent = '0';
    newQuiz();
  }
}
modeLearn.addEventListener('click', () => switchMode('learn'));
modeWrite.addEventListener('click', () => switchMode('write'));
modeQuiz.addEventListener('click', () => switchMode('quiz'));

window.addEventListener('resize', () => {
  if (!writePanel.classList.contains('hidden')) {
    resizeCanvas();
    renderWrite();
  }
});

// 初始化
renderLearn();
renderWrongList();
</script>
